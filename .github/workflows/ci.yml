name: CI Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Code Quality, Tests & Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Automated Unit Tests
        run: npm test

      - name: Validate HTML & Asset Integrity
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf-8');
            if (!html.includes('id=\"taskForm\"') || !html.includes('id=\"taskList\"')) {
              console.error('Critical elements missing in index.html');
              process.exit(1);
            }
            console.log('HTML integrity check passed!');
          "
